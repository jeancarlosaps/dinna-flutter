  <!-- Static companion generated from the animated version. -->
  <!-- Keep hero-still.svg aligned with this composition. -->
  <title id="title">dinna. — Pedido à mesa, do seu jeito.</title>
  <desc id="desc">Ilustração conceitual do aplicativo Flutter do Dinna: um prato visto de cima, um celular com cardápio, carrinho e um cartão de acompanhamento do pedido. Versão estática.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBF6F0"/><stop offset="1" stop-color="#F3E8DC"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop stop-color="#F4E3D7" stop-opacity=".95"/><stop offset="1" stop-color="#F4E3D7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="well" cx=".45" cy=".4" r=".7">
