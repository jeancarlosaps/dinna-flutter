    </radialGradient>
    <pattern id="dots" width="46" height="42" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="1.1" fill="#2A211C" opacity="0.07"/><circle cx="29" cy="23" r="0.9" fill="#2A211C" opacity="0.049"/><circle cx="16" cy="37" r="0.8" fill="#2A211C" opacity="0.056"/></pattern>
