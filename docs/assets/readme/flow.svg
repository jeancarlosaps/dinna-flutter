<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">Jornada planejada do Dinna (R1)</title>
  <desc id="desc">Fluxo planejado para a release R1. Cliente: mesa, cardápio, produto, carrinho, pedido e acompanhamento. O pedido chega à fila do restaurante, que vê detalhes, atualiza o preparo e finaliza; o status volta para o acompanhamento do cliente. O restaurante também mantém o cardápio. Nada deste fluxo está implementado na fundação (R0).</desc>
