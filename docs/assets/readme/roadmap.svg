  <title id="title">Roadmap do Dinna por releases</title>
  <desc id="desc">R0 Fundação, em andamento: app Flutter com MVVM base, API Fastify com /health e CI existem; models, rotas e contrato ainda não. R1 MVP Operacional, planejado: mesa, cardápio, carrinho, pedido, fila do restaurante e CRUD de produtos. R2 Dinna, planejado: Me ajuda a escolher, com preferências, recomendação e fallback. R3 Evoluções, icebox: QR Code, geolocalização, favoritos e dashboard.</desc>
